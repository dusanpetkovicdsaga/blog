<svg xmlns="http://www.w3.org/2000/svg" width="600" height="380" viewBox="0 0 600 380"><rect width="600" height="380" fill="#fff"/><text x="30" y="48" font-family="monospace" font-size="12" fill="#9673a6">// Review: server-side boundaries</text><text x="30" y="71" font-family="monospace" font-size="12" fill="#5987a1">import { generate } from &quot;./ai&quot;;</text><text x="30" y="94" font-family="monospace" font-size="12" fill="#888"></text><text x="30" y="117" font-family="monospace" font-size="12" fill="#9673a6">export async function createContent(req) {</text><text x="30" y="140" font-family="monospace" font-size="12" fill="#5987a1">  const user = await requireUser(req);</text><text x="30" y="163" font-family="monospace" font-size="12" fill="#888">  const input = schema.parse(req.body);</text><text x="30" y="186" font-family="monospace" font-size="12" fill="#9673a6"></text><text x="30" y="209" font-family="monospace" font-size="12" fill="#5987a1">  await enforceRateLimit(user.id);</text><text x="30" y="232" font-family="monospace" font-size="12" fill="#888"></text><text x="30" y="255" font-family="monospace" font-size="12" fill="#9673a6">  return generate({</text><text x="30" y="278" font-family="monospace" font-size="12" fill="#5987a1">    input,</text><text x="30" y="301" font-family="monospace" font-size="12" fill="#888">    apiKey: process.env.AI_API_KEY</text><text x="30" y="324" font-family="monospace" font-size="12" fill="#9673a6">  });</text><text x="30" y="347" font-family="monospace" font-size="12" fill="#5987a1">}</text><rect x="182" y="283" width="224" height="24" rx="5" fill="none" stroke="#df6b46" stroke-width="2"/></svg>