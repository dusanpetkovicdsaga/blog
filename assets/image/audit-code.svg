<svg xmlns="http://www.w3.org/2000/svg" width="600" height="380" viewBox="0 0 600 380"><rect width="600" height="380" fill="#171b1f"/><circle cx="22" cy="20" r="4" fill="#e88577"/><circle cx="38" cy="20" r="4" fill="#ebc06c"/><circle cx="54" cy="20" r="4" fill="#81b993"/><text x="16" y="52" font-family="monospace" font-size="12" fill="#657381">01</text><text x="48" y="52" font-family="monospace" font-size="12" fill="#8fbac8">export async function getMentors(user) {</text><text x="16" y="74" font-family="monospace" font-size="12" fill="#657381">02</text><text x="48" y="74" font-family="monospace" font-size="12" fill="#bca4d1">  const session = await auth.getSession();</text><text x="16" y="96" font-family="monospace" font-size="12" fill="#657381">03</text><text x="48" y="96" font-family="monospace" font-size="12" fill="#d3c093"></text><text x="16" y="118" font-family="monospace" font-size="12" fill="#657381">04</text><text x="48" y="118" font-family="monospace" font-size="12" fill="#8fbac8">  if (!session) {</text><text x="16" y="140" font-family="monospace" font-size="12" fill="#657381">05</text><text x="48" y="140" font-family="monospace" font-size="12" fill="#bca4d1">    throw new Error(&quot;Unauthorized&quot;);</text><text x="16" y="162" font-family="monospace" font-size="12" fill="#657381">06</text><text x="48" y="162" font-family="monospace" font-size="12" fill="#d3c093">  }</text><text x="16" y="184" font-family="monospace" font-size="12" fill="#657381">07</text><text x="48" y="184" font-family="monospace" font-size="12" fill="#8fbac8"></text><text x="16" y="206" font-family="monospace" font-size="12" fill="#657381">08</text><text x="48" y="206" font-family="monospace" font-size="12" fill="#bca4d1">  const mentors = await db.mentors.findMany({</text><text x="16" y="228" font-family="monospace" font-size="12" fill="#657381">09</text><text x="48" y="228" font-family="monospace" font-size="12" fill="#d3c093">    where: { organizationId: user.orgId },</text><text x="16" y="250" font-family="monospace" font-size="12" fill="#657381">10</text><text x="48" y="250" font-family="monospace" font-size="12" fill="#8fbac8">    select: { id: true, name: true }</text><text x="16" y="272" font-family="monospace" font-size="12" fill="#657381">11</text><text x="48" y="272" font-family="monospace" font-size="12" fill="#bca4d1">  });</text><text x="16" y="294" font-family="monospace" font-size="12" fill="#657381">12</text><text x="48" y="294" font-family="monospace" font-size="12" fill="#d3c093"></text><text x="16" y="316" font-family="monospace" font-size="12" fill="#657381">13</text><text x="48" y="316" font-family="monospace" font-size="12" fill="#8fbac8">  return mentors;</text><text x="16" y="338" font-family="monospace" font-size="12" fill="#657381">14</text><text x="48" y="338" font-family="monospace" font-size="12" fill="#bca4d1">}</text></svg>